[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secureforge"
version = "1.0.0"
description = "Cryptographically secure password generator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
secureforge = "secureforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
